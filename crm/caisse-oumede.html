<title>Caisse de l'Oumède</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Mise en page : barre latérale sur ordinateur, barre d'onglets en bas sur téléphone ; papier crème et olive, comme le site public. */
:root {
  --bg: #faf6ef;
  --surface: #ffffff;
  --sand: #f1e9dc;
  --ink: #1f2620;
  --ink-2: #4a524b;
  --muted: #6a7066;
  --line: #e4dbcc;
  --olive: #55603d;
  --olive-soft: #e7e9dc;
  --terra: #a8482a;
  --terra-soft: #f6e3da;
  --gold: #a87a26;
  --gold-soft: #f4ead3;
  --ok: #3d6b3f;
  --ok-soft: #e1ecdf;
  --warn: #a8482a;
  --src-booking: #3d5a86;
  --src-airbnb: #b4504a;
  --src-site: #55603d;
  --src-tel: #a87a26;
  --shadow: 0 1px 2px rgba(31,38,32,.06), 0 4px 16px rgba(31,38,32,.06);
  --serif: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 14px;
  --r-sm: 9px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161a16; --surface: #1f241e; --sand: #262c24; --ink: #efeadf; --ink-2: #cfcabd; --muted: #a2a698; --line: #353c33;
    --olive: #a7b57f; --olive-soft: #2c3324; --terra: #df8461; --terra-soft: #3a2620; --gold: #d6aa58; --gold-soft: #352d1c;
    --ok: #8fc08c; --ok-soft: #22301f; --warn: #df8461;
    --src-booking: #7f9fd0; --src-airbnb: #e08a83; --src-site: #a7b57f; --src-tel: #d6aa58;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161a16; --surface: #1f241e; --sand: #262c24; --ink: #efeadf; --ink-2: #cfcabd; --muted: #a2a698; --line: #353c33;
  --olive: #a7b57f; --olive-soft: #2c3324; --terra: #df8461; --terra-soft: #3a2620; --gold: #d6aa58; --gold-soft: #352d1c;
  --ok: #8fc08c; --ok-soft: #22301f; --warn: #df8461;
  --src-booking: #7f9fd0; --src-airbnb: #e08a83; --src-site: #a7b57f; --src-tel: #d6aa58;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
@media (min-width: 821px) { html { scrollbar-gutter: stable; } }
body.locked { overflow: hidden; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--terra); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { font-family: var(--serif); font-weight: 500; margin: 0; line-height: 1.1; text-wrap: balance; }
.num { font-variant-numeric: lining-nums tabular-nums; }
.pulse b, .kpi b, .total.big { font-family: var(--sans) !important; font-weight: 600 !important; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.pulse b { font-size: 1.9rem !important; }
.kpi b { font-size: 1.9rem !important; }
.total.big { font-size: 1.3rem !important; }

/* Structure */
.app { display: grid; grid-template-columns: 236px 1fr; min-height: 100%; }
.side { align-self: start; position: sticky; top: 0; height: 100vh; border-right: 1px solid var(--line); background: var(--sand); padding: 22px 14px; display: flex; flex-direction: column; gap: 22px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.brand svg { width: 34px; height: 34px; flex: none; }
.brand b { font-family: var(--serif); font-size: 1.3rem; font-weight: 600; font-style: italic; line-height: 1; display: block; }
.brand small { font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--r-sm); text-decoration: none; color: var(--ink-2); font-weight: 500; }
.nav a:hover { background: var(--olive-soft); color: var(--ink); }
.nav a[aria-current="page"] { background: var(--olive); color: var(--bg); }
.nav svg, .tabs svg, .ico { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.side .foot { margin-top: auto; font-size: .78rem; color: var(--muted); padding: 0 8px; }
.main { min-width: 0; padding-block: 26px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.inner { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.demo { display: inline-flex; align-items: center; gap: 8px; font-size: .74rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); background: var(--gold-soft); padding: 5px 10px; border-radius: 999px; width: fit-content; }
.tabs { display: none; }

@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; }
  .side { display: none; }
  .main { padding-block: 18px calc(96px + env(safe-area-inset-bottom, 0px)); }
  .tabs { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
  .tabs a { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px; font-size: .68rem; font-weight: 500; color: var(--muted); text-decoration: none; border-radius: 10px; }
  .tabs a[aria-current="page"] { color: var(--olive); }
  .tabs a[aria-current="page"] svg { stroke-width: 2; }
}

/* En-têtes */
.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.head h1 { font-size: clamp(2rem, 4.4vw, 2.9rem); }
.head h1 em { color: var(--olive); }
.head p { margin: 6px 0 0; color: var(--muted); }
.eyebrow { font-size: .72rem; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--olive); }
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; font-size: .88rem; }
.back:hover { color: var(--ink); }

/* Blocs */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card > h2, .sec-title { font-size: 1.45rem; margin-bottom: 12px; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 10px; }
.card > h2 small, .sec-title small { font-family: var(--sans); font-size: .8rem; color: var(--muted); font-weight: 500; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 980px) { .g3, .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 620px) { .g2, .g3 { grid-template-columns: 1fr; } }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.between { justify-content: space-between; }
.muted { color: var(--muted); }
.small { font-size: .84rem; }

/* Résumé du jour */
.pulse { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 620px) { .pulse { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.pulse a { text-decoration: none; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
.pulse a:hover { border-color: var(--olive); }
.pulse b { font-family: var(--serif); font-size: 2.2rem; font-weight: 600; line-height: 1; }
.pulse span { font-size: .84rem; color: var(--muted); }

/* Lignes de séjour */
.item { display: grid; grid-template-columns: 48px 38px minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 64px; padding: 10px 12px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--bg); text-decoration: none; color: inherit; transition: border-color .15s; }
.item.simple { grid-template-columns: minmax(0, 1fr) auto; }
.item.person { grid-template-columns: 38px minmax(0, 1fr); }
.item .chips { flex-direction: column; align-items: flex-end; gap: 4px; }
@media (max-width: 560px) { .item { grid-template-columns: 46px minmax(0, 1fr); } .item > .av { display: none; } .item .chips { grid-column: 2; flex-direction: row; flex-wrap: wrap; align-items: center; } .item.simple { grid-template-columns: minmax(0, 1fr) auto; } .item.person { grid-template-columns: 38px minmax(0, 1fr); } }
a.item:hover { border-color: var(--olive); }
.item .time { font-variant-numeric: tabular-nums; font-weight: 600; font-size: .95rem; }
.item .who { min-width: 0; flex: 1; }
.item .who b { display: block; font-weight: 600; line-height: 1.3; }
.item .who span { display: block; }
.item .who span { font-size: .82rem; color: var(--muted); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 24px; line-height: 1; font-size: .74rem; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--sand); color: var(--ink-2); white-space: nowrap; }
.chip.src::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--muted)); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--terra-soft); color: var(--terra); }
.chip.gold { background: var(--gold-soft); color: var(--gold); }
.chip.olive { background: var(--olive-soft); color: var(--olive); }

.note { display: flex; gap: 12px; padding: 12px; border-radius: var(--r-sm); background: var(--gold-soft); align-items: flex-start; }
.note.terra { background: var(--terra-soft); }
.note.olive { background: var(--olive-soft); }
.note .ico { margin-top: 2px; color: var(--gold); }
.note.terra .ico { color: var(--terra); }
.note.olive .ico { color: var(--olive); }
.note p { margin: 0; }
.note .row { margin-top: 8px; min-height: 34px; }
.note > div { min-width: 0; flex: 1; }
.done-tag { display: inline-flex; align-items: center; gap: 6px; height: 34px; font-size: .84rem; font-weight: 600; color: var(--ok); }
.done-tag.off { color: var(--muted); }

/* Boutons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: .88rem; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--olive); }
.btn.primary { background: var(--olive); border-color: var(--olive); color: var(--bg); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.terra { background: var(--terra); border-color: var(--terra); color: var(--bg); }
.btn.sm { min-height: 34px; padding: 5px 11px; font-size: .8rem; }
.btn[disabled] { opacity: .55; cursor: default; }
.quick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }

/* Planning */
.plan-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.plan { display: grid; grid-template-columns: 150px repeat(14, minmax(56px, 1fr)); min-width: 940px; }
.plan .d { padding: 8px 4px; text-align: center; font-size: .74rem; color: var(--muted); border-bottom: 1px solid var(--line); border-left: 1px solid var(--line); }
.plan .d b { display: block; font-size: 1rem; color: var(--ink); font-variant-numeric: tabular-nums; }
.plan .d.today { background: var(--olive-soft); }
.plan .d.today b { color: var(--olive); }
.plan .rn { padding: 10px 12px; font-weight: 600; font-size: .86rem; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; justify-content: center; position: sticky; left: 0; background: var(--surface); z-index: 2; }
.plan .rn span { font-weight: 400; color: var(--muted); font-size: .74rem; }
.plan .cell { border-bottom: 1px solid var(--line); border-left: 1px solid var(--line); min-height: 58px; }
.plan .cell.today { background: var(--olive-soft); }
.plan .cell.free { cursor: pointer; }
.plan .cell.free:hover { background: var(--sand); }
.bar { z-index: 1; align-self: center; margin: 0 3px; height: 40px; border-radius: 9px; padding: 4px 10px; display: flex; flex-direction: column; justify-content: center; text-decoration: none; color: var(--ink); background: color-mix(in srgb, var(--c) 16%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c) 55%, transparent); border-left: 4px solid var(--c); overflow: hidden; min-width: 0; }
.bar:hover { background: color-mix(in srgb, var(--c) 26%, var(--surface)); }
.bar { line-height: 1.25; }
.bar b { font-size: .8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar span { font-size: .7rem; color: var(--muted); white-space: nowrap; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .82rem; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--c); margin-right: 6px; vertical-align: -1px; }

/* Note du séjour */
.bill { width: 100%; border-collapse: collapse; font-size: .9rem; }
.bill td small { display: block; color: var(--muted); font-size: .8rem; }
.bill td, .bill th { padding: 9px 4px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.bill th { font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.bill td.r, .bill th.r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bill tr.new td { animation: flash 1.2s ease; }
@keyframes flash { from { background: var(--olive-soft); } to { background: transparent; } }
.total { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 4px; font-variant-numeric: tabular-nums; }
.total.big { font-family: var(--serif); font-size: 1.6rem; font-weight: 600; border-top: 2px solid var(--ink); margin-top: 6px; padding-top: 10px; }
.total.due b { color: var(--terra); }
.total.paid b { color: var(--ok); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: .9rem; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 500; }

/* Chambres */
.room { display: flex; flex-direction: column; gap: 12px; }
.room .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.room h3 { font-family: var(--sans); font-size: 1.05rem; font-weight: 600; letter-spacing: -.01em; line-height: 1.3; }
.state { font-size: .74rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.state.todo { background: var(--terra-soft); color: var(--terra); }
.state.doing { background: var(--gold-soft); color: var(--gold); }
.state.clean { background: var(--ok-soft); color: var(--ok); }
.room .meta { font-size: .84rem; color: var(--muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.room .memo { font-size: .86rem; color: var(--ink-2); margin: 0; min-height: 2.6em; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.state { min-width: 92px; text-align: center; }
.checklist { border: 1px solid var(--line); border-radius: 12px; background: var(--bg); overflow: hidden; }
.check { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 12px; align-items: center; width: 100%; height: 58px; padding: 0 14px; border: 0; background: transparent; text-align: left; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.check + .check { border-top: 1px solid var(--line); }
.check:hover { background: var(--sand); }
.check .box { width: 24px; height: 24px; border-radius: 7px; border: 1.5px solid var(--muted); display: grid; place-items: center; background: var(--surface); transition: background .12s, border-color .12s; }
.check .box svg { width: 14px; height: 14px; stroke: var(--bg); stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.check[aria-checked="true"] .box { background: var(--ok); border-color: var(--ok); }
.check[aria-checked="true"] .box svg { opacity: 1; }
.check b { display: block; font-weight: 500; font-size: .92rem; line-height: 1.25; }
.check small { display: block; font-size: .76rem; color: var(--muted); line-height: 1.25; font-variant-numeric: tabular-nums; }
.check[aria-checked="true"] small { color: var(--ok); }
.room .actions { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; }
.room .actions .btn { white-space: nowrap; }
.counts .chip { min-width: 84px; justify-content: center; }

/* Tableaux simples */
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: .9rem; }
.tbl th { text-align: left; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl td.r, .tbl th.r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl tr.link { cursor: pointer; }
.tbl tr.link:hover td { background: var(--sand); }
.seg { display: inline-flex; background: var(--sand); padding: 4px; border-radius: 11px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 7px 14px; border-radius: 8px; font-weight: 600; font-size: .85rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

/* Tableau de bord */
.kpi { display: flex; flex-direction: column; gap: 4px; }
.kpi span { font-size: .82rem; color: var(--muted); }
.kpi b { font-family: var(--serif); font-size: 2.3rem; font-weight: 600; line-height: 1.05; font-variant-numeric: tabular-nums; }
.kpi small { font-size: .8rem; font-weight: 600; }
.kpi small.up { color: var(--ok); }
.kpi small.down { color: var(--terra); }
.chart svg { width: 100%; height: auto; display: block; }
.seg[role="tablist"] { flex-wrap: nowrap; overflow-x: auto; max-width: 100%; }
.seg[role="tablist"] button { white-space: nowrap; }
.hbar { display: grid; grid-template-columns: minmax(96px, 160px) 1fr 66px; gap: 10px; align-items: center; font-size: .86rem; }
.hbar .track { height: 12px; border-radius: 6px; background: var(--sand); overflow: hidden; }
.hbar .fill { height: 100%; border-radius: 6px; background: var(--c, var(--olive)); }
.hbar .v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }

/* Avatar */
.av { width: 52px; height: 52px; border-radius: 50%; background: var(--olive-soft); color: var(--olive); display: grid; place-items: center; font-family: var(--serif); font-size: 1.4rem; font-weight: 600; flex: none; }
.av.sm { width: 38px; height: 38px; font-size: 1.05rem; }

/* Parcours client */
.journey { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.step { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; padding-block: 9px; position: relative; }
.step::before { content: ""; position: absolute; left: 14px; top: 0; bottom: 0; border-left: 2px solid var(--line); }
.step:first-child::before { top: 50%; }
.step:last-child::before { bottom: 50%; }
.step .side-r:empty { display: none; }
@media (max-width: 560px) { .step { align-items: start; } .step .dot { margin-top: 2px; } .step .side-r { grid-column: 2; justify-content: flex-start; min-width: 0; } }
.dot { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--line); background: var(--surface); color: var(--muted); position: relative; z-index: 1; }
.dot svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.step.done .dot { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.step.now .dot { background: var(--gold-soft); border-color: var(--gold); color: var(--gold); }
.step.skip { opacity: .5; }
.step .txt { min-width: 0; }
.step .txt b { display: block; font-weight: 600; font-size: .9rem; line-height: 1.3; margin-bottom: 2px; }
.step .txt span { display: block; font-size: .8rem; color: var(--muted); line-height: 1.3; }
.step .side-r { min-width: 118px; display: flex; justify-content: flex-end; }
.board-wrap { overflow-x: auto; padding-bottom: 6px; }
.board { display: grid; grid-template-columns: repeat(5, minmax(186px, 1fr)); gap: 10px; min-width: 970px; }
.col { background: var(--sand); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.col h3 { font-family: var(--sans); font-size: .8rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); display: flex; justify-content: space-between; padding: 2px 4px 6px; }
.col h3 span { color: var(--muted); }
.col p.hint { font-size: .78rem; color: var(--muted); margin: -4px 4px 4px; }
.pcard { background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 3px; }
a.pcard:hover { border-color: var(--olive); }
.pcard b { font-size: .88rem; }
.pcard span { font-size: .78rem; color: var(--muted); }
.pcard .next { font-size: .78rem; color: var(--olive); font-weight: 600; margin-top: 3px; }

/* Formulaire de réservation */
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.form .full { grid-column: 1 / -1; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label, .field .lbl { font-size: .78rem; font-weight: 600; color: var(--ink-2); }
.field input, .field select { min-height: 42px; padding: 8px 11px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); width: 100%; min-width: 0; }
.field input:focus, .field select:focus { outline: 2px solid var(--olive); outline-offset: 0; border-color: var(--olive); }
.stepper { display: grid; grid-template-columns: 42px 1fr 42px; align-items: center; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); height: 42px; overflow: hidden; }
.stepper button { height: 100%; border: 0; background: transparent; font-size: 1.1rem; font-weight: 600; }
.stepper button:hover { background: var(--sand); }
.stepper output { text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.dispo { min-height: 46px; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; font-size: .86rem; font-weight: 500; }
.dispo.ok { background: var(--ok-soft); color: var(--ok); }
.dispo.ko { background: var(--terra-soft); color: var(--terra); }
.recap { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 2px; }
.optline { display: flex; align-items: center; gap: 10px; min-height: 42px; font-size: .9rem; cursor: pointer; }
.optline input { width: 20px; height: 20px; accent-color: var(--olive); margin: 0; }
@media (max-width: 520px) { .form { grid-template-columns: 1fr 1fr; } }

/* Fenêtre et toast */
.sheet-bg { position: fixed; inset: 0; background: rgba(20,24,20,.45); z-index: 40; display: flex; align-items: center; justify-content: center; padding: 16px; }
.sheet { background: var(--surface); border-radius: 18px; width: min(560px, 100%); max-height: 86vh; overflow: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 18px 50px rgba(0,0,0,.25); }
.sheet h2 { font-size: 1.6rem; }
@media (max-width: 620px) {
  .sheet-bg { align-items: flex-end; padding: 0; }
  .sheet { border-radius: 18px 18px 0 0; width: 100%; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }
}
.pick { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); text-align: left; }
.pick:hover { border-color: var(--olive); }
a.pick { text-decoration: none; color: inherit; }
.pick b { font-weight: 600; }
.pick span { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--olive); white-space: nowrap; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 12px; font-weight: 600; font-size: .9rem; z-index: 60; box-shadow: 0 8px 24px rgba(0,0,0,.2); max-width: calc(100% - 32px); }
@media (max-width: 820px) { .toast { bottom: calc(90px + env(safe-area-inset-bottom, 0px)); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  const TAXE = 1.65;
  function bill(s) {
    const r = room(s.room), n = nights(s);
    const rows = [{ label: "Nuits · " + r.nom, detail: n + " × " + eur(r.prix), m: n * r.prix, nuit: true },
                  { label: "Taxe de séjour", detail: (s.ad) + " adulte" + (s.ad > 1 ? "s" : "") + " × " + n + " nuits × " + eur(TAXE), m: +(s.ad * n * TAXE).toFixed(2) }];
    s.lignes.forEach((l, i) => { const it = item(l.id); rows.push({ label: it.label, detail: l.q + " × " + eur(it.prix) + (l.d ? " · " + l.d : ""), m: l.q * it.prix, idx: i, fresh: l.fresh }); });
    const tot = rows.reduce((a, b) => a + b.m, 0), paid = s.pay.reduce((a, b) => a + b.m, 0);
    return { rows, tot, paid, due: +(tot - paid).toFixed(2), extras: rows.filter(x => x.idx !== undefined).reduce((a, b) => a + b.m, 0) };

    <div class="head"><div><div class="eyebrow">Avant, pendant et après le séjour</div><h1>Parcours client</h1><p>Chaque client avance tout seul d'une colonne à l'autre. Les e-mails partent automatiquement, Carla ne fait que les gestes en personne.</p></div></div>
    <div class="grid g4">
      <div class="card kpi"><span>E-mails programmés aujourd'hui</span><b>4</b><small class="muted">J-1 Morel, lendemain J. Martin et M. Rossi, veille C. Dubois</small></div>
      <div class="card kpi"><span>Gestes à faire aujourd'hui</span><b>4</b><small class="muted">2 accueils, 1 carte, 1 avis</small></div>
      <div class="card kpi"><span>Avis obtenus en juillet</span><b>14</b><small class="up">45 % des départs</small></div>
      <div class="card kpi"><span>Retours en direct</span><b>9</b><small class="up">grâce à l'e-mail 5 mois après</small></div>
    </div>
    <div class="board-wrap"><div class="board">
      ${cols.map(([k, l, h]) => { const list = k === "fidel" ? [] : STAYS.filter(s => stage(s) === k).sort((a, b) => a.du.localeCompare(b.du)); const n = k === "fidel" ? fidel.length : list.length; return `<section class="col"><h3>${l}<span>${n}</span></h3><p class="hint">${h}</p>${k === "fidel" ? fidel.map(([nm, sub, href]) => href ? `<a class="pcard" href="${href}"><b>${nm}</b><span>${sub}</span></a>` : `<div class="pcard"><b>${nm}</b><span>${sub}</span></div>`).join("") : list.map(card).join("")}</section>`; }).join("")}
    </div></div>
    <section class="card"><h2>Les étapes du parcours <small>identiques pour chaque client</small></h2>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Quand</th><th>Étape</th><th>Qui</th></tr></thead><tbody>
        ${STEPS.map(st => `<tr><td style="white-space:nowrap">${st.q}</td><td><b style="font-weight:600">${st.t}</b><br><span class="small muted">${st.sub}</span></td><td>${st.kind === "mail" ? '<span class="chip olive">Automatique</span>' : '<span class="chip gold">Carla</span>'}</td></tr>`).join("")}
      </tbody></table></div>
    </section>`;
  }

  // ---------- Nouvelle réservation ----------
  function openNewRes(roomId, day) {
    const st = { room: roomId || "c2", du: day || "2026-07-16", au: addD(day || "2026-07-16", 2), ad: 2, enf: 0, src: "tel", pdj: false, acompte: true };
    sheet(`<div class="row between"><h2>Nouvelle réservation</h2><button class="btn sm" data-x>Fermer</button></div>
      <form class="form" id="resf" novalidate>
        <div class="field full"><label for="r-nom">Nom du client</label><input id="r-nom" placeholder="Ex. Isabelle Martin" autocomplete="off"></div>
        <div class="field"><label for="r-mail">E-mail</label><input id="r-mail" type="email" placeholder="nom@exemple.fr"></div>
        <div class="field"><label for="r-tel">Téléphone</label><input id="r-tel" type="tel" placeholder="+33 6 …"></div>
        <div class="field full"><label for="r-room">Logement</label><select id="r-room">${ROOMS.map(r => `<option value="${r.id}" ${r.id === st.room ? "selected" : ""}>${r.nom} · ${eur(r.prix)} la nuit</option>`).join("")}</select></div>
        <div class="field"><label for="r-du">Arrivée</label><input id="r-du" type="date" min="2026-07-12" max="2026-09-30" value="${st.du}"></div>
        <div class="field"><label for="r-au">Départ</label><input id="r-au" type="date" min="2026-07-13" max="2026-10-01" value="${st.au}"></div>
        <div class="field"><span class="lbl">Adultes</span><div class="stepper"><button type="button" data-st="ad" data-d="-1" aria-label="Un adulte de moins">−</button><output id="o-ad">2</output><button type="button" data-st="ad" data-d="1" aria-label="Un adulte de plus">+</button></div></div>
        <div class="field"><span class="lbl">Enfants</span><div class="stepper"><button type="button" data-st="enf" data-d="-1" aria-label="Un enfant de moins">−</button><output id="o-enf">0</output><button type="button" data-st="enf" data-d="1" aria-label="Un enfant de plus">+</button></div></div>
        <div class="field full"><label for="r-src">Reçue par</label><select id="r-src"><option value="tel">Téléphone</option><option value="site">E-mail ou site (direct)</option></select></div>
        <label class="optline full"><input type="checkbox" id="r-pdj"> Petit-déjeuner inclus (18 € par personne et par jour)</label>
        <label class="optline full"><input type="checkbox" id="r-acc" checked> Envoyer un lien d'acompte de 30 % par e-mail</label>
        <div class="dispo full" id="r-dispo" role="status"></div>
        <div class="recap full" id="r-recap"></div>
        <button class="btn primary full" type="submit" id="r-go">Créer la réservation</button>
      </form>`, (el, close) => {
      const $ = id => el.querySelector("#" + id);
      function upd() {
        st.room = $("r-room").value; st.du = $("r-du").value; st.au = $("r-au").value; st.src = $("r-src").value; st.pdj = $("r-pdj").checked; st.acompte = $("r-acc").checked;
        $("o-ad").textContent = st.ad; $("o-enf").textContent = st.enf;
        const n = st.du && st.au ? Math.round((dt(st.au) - dt(st.du)) / 864e5) : 0;
        const clash = n > 0 && STAYS.find(x => x.room === st.room && x.du < st.au && x.au > st.du);
        const r = room(st.room), d = $("r-dispo");
        if (n <= 0) { d.className = "dispo full ko"; d.textContent = "La date de départ doit être après l'arrivée."; }
        else if (clash) { d.className = "dispo full ko"; d.textContent = `Déjà réservé : ${client(clash.cl).nom}, du ${fmtD(clash.du)} au ${fmtD(clash.au)}`; }
        else { d.className = "dispo full ok"; d.textContent = `${r.nom} est libre ${n} nuit${n > 1 ? "s" : ""}. Les dates seront fermées sur Booking.com et Airbnb.`; }
        const nuits = Math.max(0, n) * r.prix, taxe = +(st.ad * Math.max(0, n) * TAXE).toFixed(2), pdj = st.pdj ? (st.ad + st.enf) * Math.max(0, n) * 18 : 0, tot = nuits + taxe + pdj;
        $("r-recap").innerHTML = `<div class="total small"><span class="muted">Nuits</span><span>${eur(nuits)}</span></div><div class="total small"><span class="muted">Taxe de séjour</span><span>${eur(taxe)}</span></div><div class="total small"><span class="muted">Petit-déjeuner</span><span>${eur(pdj)}</span></div><div class="total" style="font-weight:700"><span>Total</span><span>${eur(tot)}</span></div><div class="total small"><span class="muted">${st.acompte ? "Acompte demandé maintenant" : "Pas d'acompte"}</span><span>${st.acompte ? eur(Math.round(tot * .3)) : "–"}</span></div>`;
        $("r-go").disabled = !(n > 0 && !clash);
        st.ok = n > 0 && !clash; st.tot = tot;
      }
      el.addEventListener("input", upd); el.addEventListener("change", upd);
      el.addEventListener("click", e => { const b = e.target.closest("[data-st]"); if (!b) return; const k = b.dataset.st; st[k] = Math.max(k === "ad" ? 1 : 0, Math.min(6, st[k] + +b.dataset.d)); upd(); });
      $("resf").addEventListener("submit", e => {
        e.preventDefault(); if (!st.ok) return;
        const nom = $("r-nom").value.trim();
        if (!nom) { $("r-nom").focus(); $("r-nom").style.borderColor = "var(--terra)"; toast("Indiquez le nom du client"); return; }
        let c = CLIENTS.find(x => x.nom.toLowerCase() === nom.toLowerCase());
        if (!c) { c = { id: "n" + Date.now(), nom, court: nom.split(" ").pop(), pays: "", langue: "", email: $("r-mail").value, tel: $("r-tel").value, sejours: 1, depuis: 2026, total: 0, prefs: [], occasion: "", notes: "Réservation prise par " + ($("r-src").value === "tel" ? "téléphone" : "e-mail") + ".", refus: [], acc: [] }; CLIENTS.push(c); }
        const id = Math.max(...STAYS.map(x => x.id)) + 1;
        STAYS.push({ id, cl: c.id, room: st.room, du: st.du, au: st.au, src: st.src, ad: st.ad, enf: st.enf, prevue: "", reelle: "", depart: "", pdj: st.pdj, lignes: [], pay: [] });
        close(); location.hash = "#sejour-" + id;
        toast("Réservation créée" + (st.acompte ? " · lien d'acompte envoyé" : ""));
      });
      upd(); if (innerWidth > 820) setTimeout(() => $("r-nom").focus(), 30);
    });
  }

  // ---------- Routeur ----------
  function render() {
    const h = (location.hash || "#aujourdhui").slice(1);
    let html;
    if (h.startsWith("sejour-")) html = vStay(+h.split("-")[1]);
    else if (h.startsWith("client-")) html = vClient(h.slice(7));
    else html = ({ aujourdhui: vToday, planning: vPlanning, chambres: vRooms, parcours: vJourney, clients: vClients, catalogue: vCatalogue, bilan: vBilan }[h] || vToday)();
    document.getElementById("view").innerHTML = html;
    renderNav(h);
    const at = document.querySelector('[role="tablist"] [aria-pressed="true"]'); if (at) { const tl = at.parentNode; tl.scrollLeft = at.offsetLeft - tl.offsetLeft - 8; }
  }
  function rerender() { const y = window.scrollY; render(); window.scrollTo(0, y); }
  window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });

  // ---------- Actions ----------
  const NOW = "16:42";
  function addLine(stayId, id, q) {
    const s = STAYS.find(x => x.id === stayId);
    s.lignes.forEach(l => (l.fresh = false));
    s.lignes.push({ id, q: q || 1, d: "16/07", fresh: true });
    toast(item(id).label + " ajouté à la note de " + client(s.cl).nom);
  }
  function openAdd(cat, stayId) {
    const titles = { pdj: "Petit-déjeuner", minibar: "Minibar", activites: "Activité", extras: "Extra" };
    const s = STAYS.find(x => x.id === stayId), c = client(s.cl);
    sheet(`<div class="row between"><h2>${titles[cat]}</h2><button class="btn sm" data-x>Fermer</button></div>
      <p class="muted small" style="margin:0">Pour ${esc(c.nom)} · ${room(s.room).nom}</p>
      <div class="row"><span class="small muted">Quantité</span><div class="seg" id="qty">${[1, 2, 3, 4].map(n => `<button aria-pressed="${n === (cat === "pdj" ? s.ad : 1)}" data-q="${n}">${n}</button>`).join("")}</div></div>
      <div class="stack">${CAT[cat].map(x => `<button class="pick" data-pick="${x.id}"><b>${esc(x.label)}</b><span>${x.prix ? eur(x.prix) : "Offert"}</span></button>`).join("")}</div>`,
      (el, close) => {
        el.addEventListener("click", e => {
          const q = e.target.closest("[data-q]");
          if (q) { el.querySelectorAll("[data-q]").forEach(b => b.setAttribute("aria-pressed", b === q)); return; }
          const p = e.target.closest("[data-pick]");
          if (p) { const n = +el.querySelector('[data-q][aria-pressed="true"]').dataset.q; addLine(stayId, p.dataset.pick, n); close(); rerender(); }
        });
      });
  }
  function openPay(stayId) {
    const s = STAYS.find(x => x.id === stayId), b = bill(s);
    sheet(`<div class="row between"><h2>Encaisser</h2><button class="btn sm" data-x>Fermer</button></div>
      <p style="margin:0">${esc(client(s.cl).nom)} · reste à payer <b class="num">${eur(b.due)}</b></p>
      <div class="stack">${[["Carte (terminal)", "Carte"], ["Lien de paiement par e-mail", "Lien Stripe"], ["Espèces", "Espèces"], ["Virement", "Virement"]].map(([l, k]) => `<button class="pick" data-mo="${k}"><b>${l}</b><span>${eur(b.due)}</span></button>`).join("")}</div>
      <p class="small muted" style="margin:0">Dans la vraie version, la carte passe par Stripe et la facture part toute seule par e-mail.</p>`,
      (el, close) => el.addEventListener("click", e => { const m = e.target.closest("[data-mo]"); if (!m) return; s.pay.push({ l: "Solde au départ", m: b.due, mo: m.dataset.mo }); close(); rerender(); toast("Paiement de " + eur(b.due) + " enregistré"); }));
  }

  document.addEventListener("click", e => {
    const t = e.target;
    const go = t.closest("[data-go]"); if (go) { location.hash = go.dataset.go; return; }
    const add = t.closest("[data-add]:not([disabled])"); if (add) { openAdd(add.dataset.add, +add.dataset.stay); return; }
    const cat = t.closest("[data-cat]"); if (cat) { catTab = cat.dataset.cat; rerender(); return; }
    const stt = t.closest("[data-stat]"); if (stt) { statTab = stt.dataset.stat; rerender(); return; }
    const tg = t.closest(".check[data-room]");
    if (tg) { const id = tg.dataset.room, S = ROOMSTATE[id], k = tg.dataset.k; S[k] = !S[k]; S["t_" + k] = S[k] ? NOW : ""; S.st = roomState(S); if (S.st === "clean") S.note = "Faite à " + NOW; refreshRoom(id); return; }
    const cl = t.closest("[data-clean]"); if (cl) { const id = cl.dataset.clean, S = ROOMSTATE[id];
      if (S.st === "clean") Object.assign(S, { st: "todo", draps: false, serv: false, mini: false, t_draps: "", t_serv: "", t_mini: "", note: "À refaire" });
      else { CHECKS.forEach(([k]) => { if (!S[k]) { S[k] = true; S["t_" + k] = NOW; } }); Object.assign(S, { st: "clean", note: "Faite à " + NOW }); toast(room(id).nom + " propre à " + NOW); }
      refreshRoom(id); return; }
    const fr = t.closest("[data-free]"); if (fr) { const [r, d] = fr.dataset.free.split("|"); openNewRes(r, d); return; }
    if (t.closest("[data-newres]")) { openNewRes(); return; }
    if (t.closest("[data-more]")) { e.preventDefault(); openMore(); return; }
    const stp = t.closest("[data-step]"); if (stp) { DONE[stp.dataset.step] = true; rerender(); toast("Noté à " + NOW); return; }
    const seg = t.closest(".seg button:not([data-cat]):not([data-q]):not([data-stat])"); if (seg) { seg.parentNode.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b === seg)); toast("Vue « " + seg.textContent + " » (dans la vraie version)"); return; }
    const a = t.closest("[data-act]"); if (!a) return;
    const id = +a.dataset.stay, s = STAYS.find(x => x.id === id);
    switch (a.dataset.act) {
      case "arrive": s.reelle = NOW; rerender(); toast("Arrivée de " + client(s.cl).nom + " notée à " + NOW); break;
      case "parti": toast("Départ noté. La chambre passe en « à faire »."); ROOMSTATE[s.room].st = "todo"; break;
      case "encaisser": openPay(id); break;
      case "fleurs": addLine(8, "fleurs", 1); UI.fleurs = true; rerender(); break;
      case "pdjmartin": addLine(1, "pdj", 8); STAYS[0].pdj = true; UI.pdj = "oui"; rerender(); break;
      case "refus": UI.pdj = "non"; rerender(); break;
      case "propose": UI.rossi = true; rerender(); break;
      case "facture": toast("La facture PDF sera générée ici"); break;
      case "apercu": toast("Aperçu de l'e-mail (dans la vraie version)"); break;
      default: toast("Disponible dans la vraie version");
    }
  });
  document.addEventListener("input", e => {
    if (e.target.id !== "q") return;
    const v = e.target.value.trim().toLowerCase();
    document.querySelectorAll("#ctbl tbody tr").forEach(tr => (tr.hidden = v && !tr.dataset.name.includes(v)));
  });

  render();
})();
</script>
